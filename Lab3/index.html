<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">
<div class="container py-5" style="max-width: 640px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h3 mb-4 text-center">Sign Up Form</h1>

      <form id="signupForm" action="welcome.html">
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="fName" class="form-label">First Name</label>
            <input type="text" id="fName" name="fName" class="form-control">
          </div>
          <div class="col-sm-6">
            <label for="lName" class="form-label">Last Name</label>
            <input type="text" id="lName" name="lName" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <span class="form-label d-block">Gender</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderM" value="m">
            <label class="form-check-label" for="genderM">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
            <label class="form-check-label" for="genderF">Female</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="zip" class="form-label">Zip Code</label>
          <div class="d-flex align-items-center gap-2">
            <input type="text" id="zip" name="zip" class="form-control w-50">
            <span id="zipError" class="text-danger"></span>
          </div>
        </div>

        <div class="mb-3 p-3 bg-body-tertiary border rounded small">
          <div>City: <strong id="city"></strong></div>
          <div>Latitude: <strong id="latitude"></strong></div>
          <div>Longitude: <strong id="longitude"></strong></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="state" class="form-label">State</label>
            <select id="state" name="state" class="form-select">
              <option value="">Loading states...</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label for="county" class="form-label">Select a County</label>
            <select id="county" name="county" class="form-select"></select>
          </div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Desired Username</label>
          <input type="text" id="username" name="username" class="form-control">
          <span id="usernameError"></span>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="d-flex align-items-center gap-2">
            <input type="password" id="password" name="password" class="form-control w-50">
            <span id="suggestedPwd" class="text-secondary"></span>
          </div>
        </div>

        <div class="mb-3">
          <label for="passwordAgain" class="form-label">Type Password Again</label>
          <input type="password" id="passwordAgain" name="passwordAgain" class="form-control w-50">
          <span id="passwordError" class="text-danger"></span>
        </div>

        <button class="btn btn-primary w-100">Sign up!</button>
      </form>
    </div>
  </div>
</div>

<footer>
      <p>&copy; 2026 David Renteria. All rights reserved.</p>
      <p>This site is for academic purposes only.</p>
      <p>CST 336 Internet Programming.</p>
      <img src="img/csumb-logo.png" alt="CSUMB logo" class="logo">
</footer>

<script src="js/scripts.js"></script>
</body>
</html>
